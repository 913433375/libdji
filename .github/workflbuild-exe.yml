name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          # 假设源码里包含 cmd/djictl 目录，如果路径不同可按实际调整
          cd cmd/djictl
          GOOS=windows GOARCH=amd64 go build -o ../../djictl.exe .

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djictl-windows-exe
          path: djictl.exe
