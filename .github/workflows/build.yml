name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build djictl for Windows
        run: |
          cd cmd/djictl
          GOOS=windows GOARCH=amd64 go build -o ../../djictl.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: djictl-windows
          path: djictl.exe
