name: Build libdji for Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: simonlovesyou/setup-qt@v1 # 或者使用成熟的 setup-qt 动作
        with:
          qt-version: '6.6.3'
          qt-modules: 'qtconnectivity'

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: dji-demo-windows-exe
          path: build/tests/Release/dji_demo.exe
